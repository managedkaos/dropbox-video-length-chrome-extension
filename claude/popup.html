<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 300px;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            margin: 0;
        }

        h1 {
            font-size: 16px;
            margin: 0 0 12px 0;
            font-weight: 600;
        }

        p {
            font-size: 14px;
            color: #5f6368;
            margin: 8px 0;
            line-height: 1.5;
        }

        button {
            width: 100%;
            padding: 8px;
            background: #0061ff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            margin-top: 12px;
        }

        button:hover {
            background: #0052cc;
        }
    </style>
</head>

<body>
    <h1>Dropbox Video Duration</h1>
    <p>This extension adds a "Duration" column to Dropbox folder views showing video lengths.</p>
    <p>Navigate to a Dropbox folder with videos to see it in action!</p>
    <button id="refresh">Refresh Durations</button>
    <script src="popup.js"></script>
</body>

</html>
